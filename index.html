        let familyCode = '';
        let currentRole = '';
        let currentIndex = 0;
        let answers = [];

        function checkAndStart(role) {
            const codeInput = document.getElementById('family-code').value.trim();
            if (!codeInput) { alert('⚠️ 请输入家庭识别码！'); return; }
            familyCode = codeInput; currentRole = role; currentIndex = 0; answers = [];
            document.getElementById('role-badge').innerText = role;
            showPage('survey-page'); updateQuestion();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0);
        }

        function updateQuestion() {
            const q = questions[currentIndex];
            document.getElementById('question-text').innerText = q[currentRole];
            document.getElementById('progress-bar').style.width = ((currentIndex + 1) / questions.length * 100) + '%';
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;
            document.getElementById('dimension-tag').innerText = q['维度'];
        }

        function recordAnswer(val) {
            const q = questions[currentIndex];
            const text = q[currentRole];
            const isReverse = text.includes('（R）') || text.includes('(R）') || text.includes('(R)');
            answers.push({ dimension: q['维度'], score: isReverse ? (6 - val) : val });

            if (currentIndex < questions.length - 1) { currentIndex++; updateQuestion(); } 
            else { uploadToCloud(); }
        }

        async function uploadToCloud() {
            showPage('result-page');
            try {
                const { data, error } = await supabase
                    .from('assessment_results')
                    .insert([{ family_code: familyCode, role: currentRole, results: answers }]);
                if (error) throw error;
                document.getElementById('uploading').classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
            } catch (err) {
                alert('云端同步失败，请检查网络并重试。错误信息：' + err.message);
                console.error(err);
            }
        }
    </script>
